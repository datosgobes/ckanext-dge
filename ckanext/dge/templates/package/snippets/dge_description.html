{% set language, value = h.dge_dataset_field_value(pkg_dict.description) %}
{% if value %}
<div class="container-style relative container-style-gray mt-4">
  <div scope="row" class="x-large text--strong mb-2 text--color-primary-dark">{{ _('Description') }}</div>
  <div>
    <div class="read-more read-more--xs">
      <div class="text-line-height-normal container-markdown">
        {% if (language and value) %}
          <div lang='{{language}}' xml:lang='{{language}}'>{{ h.render_markdown(value) }}</div>
        {% elif value %}
          {{ h.render_markdown(value) }}
        {% endif %}
      </div>
    </div>
    <div class="read-more__bottom read-more__bottom__description read-more__bottom--gray">
      <button role="button" class="" data-more="{{ _('Read more') }}" data-less="{{_('Read less') }}">{{ _('Read more') }}</button>
      
    </div>
  </div>
</div>
{% endif %}
